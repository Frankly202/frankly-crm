        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - id
            - isUnread
          properties:
            id:
              type: string
              format: uuid
            lastReadAt:
              type: string
              format: date-time
              nullable: true
            isUnread:
              type: boolean
              example: false

    WebsiteFormPayload:
      type: object
      properties:
        name:
          type: string
          example: Elena Constantinou
        email:
          type: string
          format: email
          example: elena@example.com
        phone:
          type: string
          example: '+35799778899'
        category:
          type: string
          enum:
            - PROPERTY_BUYER_INVESTOR
            - PROPERTY_SELLER_AGENT
            - STUDY_ABROAD_STUDENT
            - UNIVERSITY_EDUCATION_PARTNER
            - OTHER_BUSINESS
          example: PROPERTY_BUYER_INVESTOR
        message:
          type: string
          example: Looking for a 3-bedroom villa in Paphos near the sea.
        notes:
          type: string
          example: Budget €800k - €1.2M
        submissionId:
          type: string
          example: web_sub_998877
        _hp_company:
          type: string
          description: Honeypot bot detection field. Must be empty for legitimate users.
          example: ''

    WebhookProcessingResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - channel
            - processedCount
            - messages
          properties:
            channel:
              $ref: '#/components/schemas/ChannelType'
            processedCount:
              type: integer
              example: 1
            messages:
              type: array
              items:
                type: object
                required:
                  - messageId
                  - deduplicated
                  - leadId
                  - contactId
                properties:
                  messageId:
                    type: string
                    format: uuid
                  externalMessageId:
                    type: string
                    nullable: true
                  deduplicated:
                    type: boolean
                  leadId:
                    type: string
                    format: uuid
                  contactId:
                    type: string
                    format: uuid

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Invalid request parameters

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                body:
                  email:
                    - Valid email address is required

    UnauthorizedError:
      description: Missing, invalid, or expired authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required

    ForbiddenError:
      description: Insufficient permissions for requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Insufficient permissions to perform this action

    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    ConflictError:
      description: Resource conflict or duplicate identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            error:
              code: CONFLICT
              message: Contact with this email already exists
